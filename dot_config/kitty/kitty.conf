background_opacity 0.80


# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten '/home/praveen/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'
# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output


# Animate cursor after it has been stationary for 50ms
cursor_trail 3

# # How quickly the trail disappears
cursor_trail_decay 0.05 0.20
#
# # Only animate jumps of 2+ cells
cursor_trail_start_threshold 2



font_family FiraCode Nerd Font
# scrollback_pager +kitten kitty_scrollback_nvim


allow_remote_control socket-only

listen_on unix:/tmp/kitty
shell_integration enabled
# map ctrl+shift+x show_scrollback
# BEGIN_KITTY_THEME
# 1984 Dark
include current-theme.conf
# END_KITTY_THEME
